name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # npm trusted publishing requires npm 11.5.1 or newer for OIDC exchange.
      - run: npm install --global npm@11
      - run: npm ci
      - run: npm run check
      - run: npm publish --workspace @muzluk/mood-wheel --access public --provenance
      - run: npm publish --workspace @muzluk/agent-questions --access public --provenance
